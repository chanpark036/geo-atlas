# CI template: copy to .github/workflows/ci.yml when workflow-upload access is available.
name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm install --global pnpm@10.28.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm test
      - run: |
          python3 -m venv "$RUNNER_TEMP/geoatlas-tools"
          "$RUNNER_TEMP/geoatlas-tools/bin/pip" install uv==0.13.5 ruff==0.17.3
          echo "$RUNNER_TEMP/geoatlas-tools/bin" >> "$GITHUB_PATH"
      - run: uv sync --project analytics --frozen --python 3.12
      - run: ruff format --check scripts analytics
      - run: pnpm test:python
      - run: pnpm build
